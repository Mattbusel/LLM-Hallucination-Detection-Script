# Python wheels for llm-token-visualizer (PyPI), built from pyproject.toml and
# python/. Runs on tags named py-v<version> (for example py-v0.6.1), whose
# version must match python/Cargo.toml. One abi3 wheel per platform covers
# CPython 3.9 and newer.
#
# Publishing uses PyPI trusted publishing (no API token): on pypi.org, add a
# trusted publisher for the project with this repository, the workflow file
# name "python.yml" and the environment "pypi".
name: python-wheels

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches python/Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#py-v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -n1)"
          echo "tag $tag, python/Cargo.toml $crate"
          test "$tag" = "$crate"

  wheels:
    name: wheel ${{ matrix.os }} ${{ matrix.target }} ${{ matrix.manylinux }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto, test: false }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, test: false }
          - { os: windows-latest, target: x64, manylinux: "", test: true }
          - { os: macos-latest, target: aarch64, manylinux: "", test: true }
          - { os: macos-latest, target: x86_64, manylinux: "", test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist llm-token-visualizer
          python -m pip install pytest openai
          python -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [check-version, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-token-visualizer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
